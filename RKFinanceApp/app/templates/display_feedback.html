<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आर.के फाइनेंशियल</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">आर.के फाइनेंशियल</a>
            <div class="navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">HOME</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 style="color:#8AFF33; text-align: center;">आर के फायनान्शिअल विषय इतर व्यक्ती काय म्हणतात आणि लोकांच्या आयुष्यात कसे परिवर्तन झाले तुम्ही स्वतः बघा</h1>
    </div>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Font Awesome JS -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            $.ajax({
                url: '/get/feedback/',  // URL of your Django view
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    var formattedData = '';
                    if (response.hasOwnProperty('data')) {
                        $.each(response.data, function(index, entry) {
                            formattedData += '<div class="feedback-item">';
                            formattedData += '<p><strong>Name:</strong> ' + entry.name + '</p>';
                            formattedData += '<p><strong>Feedback:</strong> ' + entry.feedback + '</p>';
                            formattedData += '</div>';
                        });
                        $('#responseData').html(formattedData);
                    } else {
                        console.error('Error: "data" key not found in response.');
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error:', error);
                }
            });
        });
    </script>
</body>
</html>
